# Jedna stale uruchomiona instancja: serwer prowadzi symulację, telefony tylko sterują.
# Wybór płatnego planu następuje dopiero przy utworzeniu usługi w Render.
services:
  - type: web
    name: wormsy-online
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && VITE_TRANSPORT=ws npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
