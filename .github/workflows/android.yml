name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "client/**"
      - "shared/**"
      - "package*.json"
      - "vite.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android platform
        run: |
          sdk_manager=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$sdk_manager"
          "$sdk_manager" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: VITE_TRANSPORT=ws npm run build
      - run: mkdir -p android/app/src/main/assets/www && cp -R dist/client/. android/app/src/main/assets/www/
      - run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wormsy-android-bluetooth
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_NUMBER}" \
            "android/app/build/outputs/apk/debug/app-debug.apk#Wormsy-Android.apk" \
            --title "Wormsy Android · build ${GITHUB_RUN_NUMBER}" \
            --notes "Android APK z Bluetooth i trybem solo. Wersja testowa podpisana kluczem debug." \
            --latest
